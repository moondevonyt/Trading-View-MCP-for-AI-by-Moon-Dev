[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingview-mcp"
version = "0.1.0"
description = "Moon Dev's TradingView MCP Server - control TradingView in Chrome via natural conversation with Claude"
authors = [{ name = "Moon Dev" }]
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "mcp>=1.0.0",
    "websocket-client>=1.7.0",
    "requests>=2.31.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
tradingview-mcp = "tradingview_mcp.server:main"

[tool.setuptools.packages.find]
include = ["tradingview_mcp*"]
